server.port: ${SERVER_PORT:8083}
spring:
  application.name: scheduling-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scheduling_db}
    username: ${DB_USER:scheduling_app}
    password: ${DB_PASSWORD:scheduling_local}
  flyway.locations: classpath:db/migration
  jackson.time-zone: UTC
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
security:
  resource-server.enabled: true
  issuer: ${JWT_ISSUER:http://identity-service:8081}
  audience: ${JWT_AUDIENCE:clinic-api}
  jwks-uri: ${JWT_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}
app:
  clinic-timezone: ${CLINIC_TIMEZONE:Asia/Ho_Chi_Minh}
  patient-service-url: ${PATIENT_BASE_URL:http://localhost:8082}
events:
  enabled: true
  outbox.enabled: true
  consumer.enabled: true
spring.rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  username: ${RABBITMQ_USER:clinic}
  password: ${RABBITMQ_PASSWORD:clinic_local}
  publisher-confirm-type: correlated
  publisher-returns: true
  listener.simple.retry.enabled: true
  listener.simple.retry.max-attempts: 5
  listener.simple.retry.initial-interval: 1s
  listener.simple.retry.multiplier: 2
  listener.simple.retry.max-interval: 10s
  listener.simple.default-requeue-rejected: false

