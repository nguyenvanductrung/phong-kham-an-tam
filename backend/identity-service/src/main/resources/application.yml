server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:identity_app}
    password: ${DB_PASSWORD:identity_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
security:
  resource-server:
    enabled: true
  issuer: ${JWT_ISSUER:http://identity-service:8081}
  audience: ${JWT_AUDIENCE:clinic-api}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:10}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  private-key-base64: ${IDENTITY_JWT_PRIVATE_KEY:}
  public-key-base64: ${IDENTITY_JWT_PUBLIC_KEY:}
app:
  demo-password: ${DEMO_LOGIN_PASSWORD:}
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"

