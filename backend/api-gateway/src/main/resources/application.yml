server.port: ${SERVER_PORT:8080}
spring:
  application.name: api-gateway
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
  cloud.gateway.server.webflux:
    httpclient:
      connect-timeout: 2000
      response-timeout: 5s
    routes:
      - id: identity
        uri: ${IDENTITY_BASE_URL:http://localhost:8081}
        predicates:
          - Path=/api/v1/auth/**,/api/v1/admin/users/**,/.well-known/**
        filters:
          - name: RequestRateLimiter
            args:
              key-resolver: "#{@ipKeyResolver}"
              redis-rate-limiter.replenishRate: 5
              redis-rate-limiter.burstCapacity: 10
      - id: patient
        uri: ${PATIENT_BASE_URL:http://localhost:8082}
        predicates: [Path=/api/v1/patients/**]
      - id: scheduling
        uri: ${SCHEDULING_BASE_URL:http://localhost:8083}
        predicates:
          - Path=/api/v1/appointments/**,/api/v1/catalog/**,/api/v1/availability,/api/v1/admin/scheduling/**
      - id: clinical
        uri: ${CLINICAL_BASE_URL:http://localhost:8084}
        predicates: [Path=/api/v1/clinical/**]
      - id: notification
        uri: ${NOTIFICATION_BASE_URL:http://localhost:8085}
        predicates: [Path=/api/v1/notifications/**]
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
security:
  jwks-uri: ${JWT_JWKS_URI:http://identity-service:8081/.well-known/jwks.json}
  issuer: ${JWT_ISSUER:http://identity-service:8081}
  audience: ${JWT_AUDIENCE:clinic-api}

